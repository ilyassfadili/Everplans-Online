<!--
  Everplans - "Confirm signup" email template

  Not read by the app - this is source for a manual paste into the
  Supabase dashboard (Authentication -> Email Templates -> "Confirm
  signup"), the same "prepared for you to apply" situation as
  supabase/migrations/. See [[everplans-email-confirmation-pending]] for
  the full checklist this belongs to.

  Suggested subject line: Confirm your Everplans account

  The confirmation link below is built manually from {{ .SiteURL }} and
  {{ .TokenHash }} rather than using Supabase's own {{ .ConfirmationURL }} -
  that variable points at a Supabase-hosted page, not this app's own
  /auth/confirm route handler (src/app/auth/confirm/route.ts), which is
  what actually creates the session correctly for this project's
  server-rendered (@supabase/ssr) setup. Table-based layout and inline
  styles throughout because email clients don't reliably support anything
  else - this is not a corner cut, it's how HTML email has to be written.
-->
<div style="background-color:#f0f0f1;padding:40px 16px;font-family:Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background-color:#ffffff;border-radius:12px;overflow:hidden;">
    <tr>
      <td style="background-color:#415a77;height:4px;line-height:4px;font-size:0;">&nbsp;</td>
    </tr>
    <tr>
      <td style="padding:40px 32px 36px;">
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin-bottom:32px;">
          <tr>
            <td style="width:28px;height:28px;background-color:#415a77;border-radius:6px;font-size:0;">&nbsp;</td>
            <td style="padding-left:10px;font-size:20px;font-weight:600;color:#000814;">Everplans</td>
          </tr>
        </table>

        <h1 style="font-size:22px;line-height:1.3;font-weight:600;color:#000814;margin:0 0 12px;">
          Confirm your email
        </h1>
        <p style="font-size:15px;line-height:1.6;color:#474d56;margin:0 0 28px;">
          Click the button below to confirm <strong>{{ .Email }}</strong> and finish setting up
          your Everplans account.
        </p>

        <table role="presentation" cellpadding="0" cellspacing="0">
          <tr>
            <td style="background-color:#415a77;border-radius:8px;">
              <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=signup"
                 style="display:inline-block;padding:12px 28px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;">
                Confirm email
              </a>
            </td>
          </tr>
        </table>

        <p style="font-size:13px;line-height:1.6;color:#8a8d93;margin:28px 0 0;">
          If you didn’t create an account with Everplans, you can safely ignore this email -
          no account will be created.
        </p>
      </td>
    </tr>
  </table>
</div>
